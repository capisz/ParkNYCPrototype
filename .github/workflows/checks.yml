name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix web
      - run: npm test
      - run: npm run build

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project ParkNYCPrototype.xcodeproj -scheme ParkNYCPrototype -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
